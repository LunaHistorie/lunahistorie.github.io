{{ define "main" }}

<div class="max-w-[1024px] mx-auto pt-[80px] md:pt-[128px] pb-[128px] px-4 md:px-8">

  <a
    href="/"
    class="block border-b-1 p-2 mb-[24px] hover:text-blue-900"
  >
    ← Kembali Ke Halaman Utama
  </a>

  <h1 class="text-[48px] md:text-[80px] lg:text-[128px] text-blue-950 font-semibold">
    Archive
  </h1>

  <div class="mt-[64px]">

    {{ range site.RegularPages.GroupByDate "January 2006" }}

      <section class="mb-[48px]">

        <h2 class="text-3xl md:text-4xl font-semibold mb-4">
          {{ .Key }}
        </h2>

        <div class="flex flex-col">

          {{ range .Pages }}

            <a
              href="{{ .RelPermalink }}"
              class="py-3 border-b hover:text-blue-900 transition"
            >
              {{ .Date.Format "02 January 2006" }} —
              {{ .Title }}
            </a>

          {{ end }}

        </div>

      </section>

    {{ end }}

  </div>

</div>

{{ end }}
