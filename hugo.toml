[build]
  [build.buildStats]
    enable = true
  [[build.cachebusters]]
    source = 'assets/notwatching/hugo_stats\.json'
    target = 'css'
  [[build.cachebusters]]
    source = '(postcss|tailwind)\.config\.js'
    target = 'css'
[module]
  [[module.mounts]]
    source = 'assets'
    target = 'assets'
  [[module.mounts]]
    disableWatch = true
    source = 'hugo_stats.json'
    target = 'assets/notwatching/hugo_stats.json'

paginate = 10
baseURL = 'https://lunahistorie.github.io/'
locale = 'id'
title = 'Luna Historie'

[params]
description = 'Jelajahi sejarah lewat cerita visual'

[taxonomies]
category = "categories"
tag = "tags"
